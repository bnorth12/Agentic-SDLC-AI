# Platform gate registry — modes: mandatory | optional | waived | maturity-gated
version: "0.1.0"
gates:
  - id: G0_wave_charter
    name: Wave / sprint charter
    phase: planning
    default_mode: mandatory
    executor: { type: procedural, skill: orchestrate-sdlc }
    viewer: viewer.markdown
  - id: G1_traceability
    name: Requirements traceability clean
    phase: requirements
    default_mode: maturity-gated
    executor: { type: procedural, skill: traceability-audit-sdlc }
    viewer: viewer.markdown
    enforce_at: [merge_main]
  - id: G2_icd_interfaces
    name: Interface control document
    phase: architecture
    default_mode: optional
    executor: { type: procedural, skill: icd-maintenance-sdlc }
    viewer: viewer.icd-csv
  - id: G3_verification_plan
    name: V&V plan sync
    phase: verification
    default_mode: optional
    executor: { type: procedural, skill: validation-plan-sdlc }
    viewer: viewer.markdown
  - id: G4_independent_review
    name: EIRC commit/merge review
    phase: implementation
    default_mode: maturity-gated
    executor: { type: procedural, skill: independent-review-sdlc }
    viewer: viewer.markdown
    enforce_at: [commit, merge_main]
  - id: G5_baseline
    name: Configuration baseline
    phase: release
    default_mode: optional
    executor: { type: procedural, skill: configuration-baseline-sdlc }
    viewer: viewer.markdown
  - id: TM_pipeline_hitl
    name: Threat model pipeline HITL
    phase: security
    default_mode: mandatory
    executor: { type: langgraph, plugin: threat-modeling }
    viewer: viewer.graph-canonical
    source: matm

  # Governance wiring for "full engineering rigor before coding or user exposure"
  # Enforced in PS wrappers and GUI dispatch points (L2 pre-flights + L3 evaluation).
  # Prevents starting work or giving commands to users/ACP before upfront engineering + testing.
  - id: G0.1_upfront_engineering
    name: Upfront engineering (requirements, architecture, hierarchy, policy, traceability) before any coding or new surface work
    phase: planning
    default_mode: mandatory
    executor: { type: procedural, skill: ide-governance-policy-compiler }  # composes with hierarchy-steward, architecture-document-surface-enforcer, source-to-evidence-traceability etc.
    viewer: viewer.markdown
    enforce_at: [any_user_action, coding_start, skill_invoke, acp_handoff]

  - id: G_pre_user_command_testing
    name: Pre-user-command / pre-exposure testing and compliance (check-work, verification coverage, sprint compliance) before any command line, GUI button, or ACP suggestion is passed to a user or agent for trial
    phase: verification
    default_mode: mandatory
    executor: { type: procedural, skill: ide-check-work-commit }  # or ide-verification-coverage / ide-sprint-execution-compliance-monitor
    viewer: viewer.markdown
    enforce_at: [user_facing_command, palette_dispatch, acp_send, ps_wrapper_exec, gui_invoke]

  - id: G_hmi_governance_enforcement
    name: HMI / interface governance (PS and GUI surfaces must run full rigor skills/tools before exposing actions)
    phase: implementation
    default_mode: mandatory
    executor: { type: procedural, skill: ide-governance-policy-compiler }
    viewer: viewer.markdown
    enforce_at: [gui_menu, gui_palette, gui_panel, ps_entry]