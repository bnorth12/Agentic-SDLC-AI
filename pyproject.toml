[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-ai"
version = "0.2.0"
description = "Plugin-adaptable agentic IDE platform for assured systems engineering (reboot scaffold)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agentic SDLC AI Contributors" }]
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.7.0",
  "ipython>=8.26.0",
  "ipdb>=0.13.13",
]

ui = [
  "streamlit>=1.37.0",
  "plotly>=5.22.0",
]

[project.scripts]
agentic-sdlc = "src.cli.main:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
  "E501",  # Line too long (handled by formatter)
  "I001",  # Import order debt tracked separately
  "N802",  # Legacy override naming in stdlib formatter subclass
  "W191",  # Existing tab indentation debt
  "W292",  # Existing newline-at-EOF debt
  "W293",  # Existing trailing whitespace debt
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
